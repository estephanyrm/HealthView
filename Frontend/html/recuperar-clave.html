<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <title>Recuperar contraseña | HealthView</title>
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="../javascript/ui.js"></script>
  </head>
  <body>
    <header class="encabezado-login">
      <a class="marca" href="index.html">
        <img src="../img/logo-icono.png" alt="" />
        <span>HealthView</span>
      </a>
    </header>

    <main class="contenido-login">
      <section class="panel-login card" aria-labelledby="recuperacion-titulo">
        <a class="parrafo-enlace enlace-retorno" href="login.html">
          <span aria-hidden="true">&larr;</span>
          <span>Volver a iniciar sesión</span>
        </a>
        <p class="etiqueta-superior mt-4">Acceso seguro</p>
        <h1 id="recuperacion-titulo">Recuperar contraseña</h1>
        <p class="descripcion-login">
          Te enviaremos un enlace de un solo uso, válido durante 30 minutos.
        </p>

        <form id="formulario-solicitud" class="formulario-login">
          <div class="mb-3">
            <label class="form-label" for="correo-recuperacion">
              Correo electrónico
            </label>
            <input
              class="form-control"
              id="correo-recuperacion"
              name="correo"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <button class="btn btn-primary w-100 boton-login" type="submit">
            Enviar enlace
          </button>
        </form>

        <form id="formulario-restablecimiento" class="formulario-login d-none">
          <div class="mb-3">
            <label class="form-label" for="contrasena-nueva">
              Nueva contraseña
            </label>
            <input
              class="form-control"
              id="contrasena-nueva"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirmar-contrasena">
              Confirmar contraseña
            </label>
            <input
              class="form-control"
              id="confirmar-contrasena"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>
          <button class="btn btn-primary w-100 boton-login" type="submit">
            Guardar contraseña
          </button>
        </form>

        <div
          id="mensaje-recuperacion"
          class="alert d-none mt-3 py-2 small"
          role="status"
          aria-live="polite"
        ></div>
      </section>
    </main>

    <footer class="pie-pagina">
      <p>&copy; 2026 HealthView</p>
    </footer>
    <script src="../javascript/recuperar-clave.js"></script>
  </body>
</html>
