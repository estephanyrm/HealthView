<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <title>Cambiar contraseña | HealthView</title>
    <script src="../javascript/auth.js" data-requiere="token"></script>
  </head>
  <body>
    <header class="encabezado-login">
      <a class="marca" href="index.html">
        <img src="../img/logo-icono.png" alt="" />
        <span>HealthView</span>
      </a>
    </header>

    <main class="contenido-login">
      <section class="panel-login" aria-labelledby="clave-title">
        <p class="etiqueta-superior">Seguridad de la cuenta</p>
        <h1 id="clave-title">Cambia tu contraseña</h1>
        <p class="descripcion-login">
          Tu contraseña es temporal. Define una nueva (mínimo 8 caracteres)
          para continuar.
        </p>

        <form class="formulario-login" id="formulario-clave" action="#" method="post">
          <div class="mb-3">
            <label class="form-label" for="clave-actual">Contraseña actual</label>
            <input class="form-control" id="clave-actual" type="password"
              autocomplete="current-password" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="clave-nueva">Nueva contraseña</label>
            <input class="form-control" id="clave-nueva" type="password"
              autocomplete="new-password" minlength="8" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="clave-confirmar">Confirmar nueva contraseña</label>
            <input class="form-control" id="clave-confirmar" type="password"
              autocomplete="new-password" minlength="8" required />
          </div>

          <div id="mensaje-error" class="alert alert-danger d-none py-2 small" role="alert"></div>

          <button class="btn btn-primary w-100 boton-login" id="btn-submit" type="submit">
            Guardar contraseña
          </button>
          <button class="btn btn-link w-100 mt-2" id="btn-cancelar" type="button">
            Cerrar sesión
          </button>
        </form>
      </section>
    </main>

    <footer class="pie-pagina">
      <p>&copy; 2026 HealthView</p>
    </footer>

    <script src="../javascript/cambiar-clave.js"></script>
  </body>
</html>
